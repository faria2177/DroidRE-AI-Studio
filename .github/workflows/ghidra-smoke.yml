name: Ghidra synthetic native integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/ghidra/**'
      - 'tools/ghidra-smoke.sh'
      - '.github/workflows/ghidra-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned official Ghidra
        shell: bash
        run: |
          curl --fail --location --retry 3 --max-time 300 -o "$RUNNER_TEMP/ghidra.zip" https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
      - name: Compile synthetic fixture and validate headless export
        run: bash tools/ghidra-smoke.sh "$RUNNER_TEMP/ghidra/ghidra_12.1.4_PUBLIC" "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghidra-synthetic-smoke
          path: |
            ${{ runner.temp }}/smoke/native-evidence.tsv
            ${{ runner.temp }}/smoke/launcher.log
          if-no-files-found: warn
          retention-days: 14
