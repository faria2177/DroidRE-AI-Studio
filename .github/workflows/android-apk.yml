name: Android ABI APKs and AAB (testing only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'lib/screens/project_workspace_screen.dart'
      - 'lib/services/source_project_import.dart'
      - 'android/app/src/main/kotlin/com/jahid/droidreai/MainActivity.kt'
      - 'test/ai_studio_widget_test.dart'
      - 'test/ai_chat_service_test.dart'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  abi-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter create . --platforms=android --org com.jahid --project-name droidre_ai_studio
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      - name: Preinstall required NDK with bounded retries
        run: bash tools/ci-install-ndk.sh
      - name: Build ABI-specific test artifacts
        run: flutter build apk --release --split-per-abi
      - name: Build test-signed Android app bundle
        run: flutter build appbundle --release
      - name: Verify and hash artifacts
        run: |
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          mkdir -p dist/android-test
          cp build/app/outputs/flutter-apk/*-release.apk dist/android-test/
          cp build/app/outputs/bundle/release/app-release.aab dist/android-test/
          cd dist/android-test
          sha256sum *.apk *.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: droidre-abi-apks-aab-TEST-DEBUG-SIGNED
          path: |
            dist/android-test/*-release.apk
            dist/android-test/app-release.aab
            dist/android-test/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

# These are release-mode binaries signed with the temporary debug key from
# android/app/build.gradle.kts. They are NOT production distribution releases.
